<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Угадай счёт</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#122b4b 0,#07111f 42%,#040a12 100%)}.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:800}.badge{font-size:12px;color:#74e8b4;background:#0c2c27;border:1px solid #185445;border-radius:999px;padding:6px 9px}.hero{margin-top:22px;padding:22px;border:1px solid #1d3652;background:linear-gradient(145deg,rgba(18,44,75,.88),rgba(7,17,31,.92));border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.3)}.hero h1{font-size:30px;line-height:1.05;margin:0 0 10px}.muted{color:#9eb0c4;line-height:1.5}.status{margin-top:18px;padding:14px;border-radius:16px;background:#091725;border:1px solid #172b40}.status strong{display:block;margin-bottom:5px}.ok{color:#74e8b4}.err{color:#ff8b8b}.user{display:flex;align-items:center;gap:12px;margin-top:16px}.avatar{width:46px;height:46px;border-radius:50%;background:#17324e;object-fit:cover}.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:14px 16px;background:#1f8fff;color:#fff;font-size:16px;font-weight:750}.section{margin-top:26px}.section h2{font-size:18px}.card{padding:16px;border-radius:18px;background:#0b1928;border:1px solid #172b40}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;padding:12px 8px calc(12px + env(safe-area-inset-bottom));background:rgba(5,13,23,.94);border-top:1px solid #172b40;backdrop-filter:blur(16px)}.nav span{font-size:11px;color:#8294a8}.nav .active{color:#55aaff}code{word-break:break-all;color:#c5d6e8}</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">⚽ Угадай счёт</div><div class="badge">Telegram Mini App</div></div>
  <section class="hero">
    <h1>Лига чемпионов<br>2026/27</h1>
    <div class="muted">Прогнозируй точный счёт, соревнуйся с друзьями и Оракулом.</div>
    <div id="status" class="status"><strong>Авторизация</strong><span>Проверяем Telegram…</span></div>
    <div id="user"></div>
    <button id="retry" class="btn" hidden>Повторить вход</button>
  </section>
  <section class="section"><h2>Следующий шаг</h2><div class="card muted">После успешного входа здесь появятся ближайшие матчи, твои прогнозы и выбранная лига.</div></section>
</main>
<nav class="nav"><span class="active">Главная</span><span>Матчи</span><span>Лиги</span><span>Таблица</span><span>Меню</span></nav>
<script>
const tg=window.Telegram?.WebApp; const statusEl=document.getElementById('status'); const userEl=document.getElementById('user'); const retry=document.getElementById('retry');
if(tg){tg.ready();tg.expand();}
function state(title,text,ok=false){statusEl.innerHTML=`<strong class="${ok?'ok':'err'}">${title}</strong><span>${text}</span>`}
async function login(){
 retry.hidden=true; userEl.innerHTML='';
 if(!tg?.initData){state('Открой приложение из Telegram','initData отсутствует. После привязки Mini App запускай его кнопкой бота.');return;}
 try{
  const r=await fetch('/api/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});
  const data=await r.json(); if(!r.ok) throw new Error(data.detail||`HTTP ${r.status}`);
  localStorage.setItem('access_token',data.access_token);
  const me=await fetch('/api/auth/me',{headers:{Authorization:`Bearer ${data.access_token}`}}).then(x=>x.json());
  state('Вход выполнен',me.role==='superadmin'?'Ты вошёл как superadmin.':'Telegram-аккаунт подключён.',true);
  userEl.innerHTML=`<div class="user">${me.photo_url?`<img class="avatar" src="${me.photo_url}" alt="">`:'<div class="avatar"></div>'}<div><strong>${me.display_name||me.username||'Игрок'}</strong><div class="muted">${me.username?'@'+me.username:''}</div></div></div>`;
 }catch(e){state('Ошибка авторизации',String(e.message||e));retry.hidden=false;}
}
retry.onclick=login; login();
</script>
</body>
</html>
