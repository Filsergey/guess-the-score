<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Угадай счёт</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#12345c 0,#07111f 42%,#040a12 100%);color:#fff}.app{max-width:560px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}.top{display:flex;gap:9px;align-items:center;position:sticky;top:0;z-index:5;padding:8px 0 12px;background:linear-gradient(#07111f 75%,transparent)}.select{flex:1;background:#0d1c2e;border:1px solid #1b3652;color:#fff;border-radius:14px;padding:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.select.small{flex:.8}.bell{width:42px;height:42px;border:1px solid #1b3652;background:#0d1c2e;color:#fff;border-radius:14px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#17324e;object-fit:cover}.profile strong{font-size:14px}.profile span{display:block;font-size:11px;color:#8fa4b9}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:20px;margin:0}.link{color:#65b1ff;font-size:13px}.card{background:linear-gradient(145deg,rgba(18,43,73,.96),rgba(8,20,34,.96));border:1px solid #1b3652;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.24)}.tournament{padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center}.tournament-title{font-size:17px;font-weight:800}.muted{color:#93a8bd}.pill{font-size:12px;border:1px solid #275f4c;background:#0c2b25;color:#70e5ae;padding:6px 9px;border-radius:999px}.date{font-size:13px;color:#8da1b6;margin:18px 3px 8px}.match{padding:14px 14px 0;margin-bottom:11px;overflow:hidden;cursor:pointer}.round{text-align:center;font-size:11px;color:#8196ad;margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr 84px 1fr;align-items:start;gap:8px}.team{text-align:cen nd{text-align:center;color:#8298ae;font-size:12px}.sheet-title{font-size:21px;font-weight:850;margin:3px 0 14px}.sheet-teams{display:grid;grid-template-columns:1fr 55px 1fr;align-items:center;gap:10px;margin-top:15px}.sheet-team{text-align:center;font-weight:800}.sheet-team img,.sheet-team .crest{width:54px;height:54px}.vs{text-align:center;color:#8298ae;font-weight:800}.score-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0 10px}.score{width:76px;height:64px;border-radius:17px;border:1px solid #31516e;background:#06121e;color:#fff;text-align:center;font-size:28px;font-weight:900}.colon{font-size:26px;color:#71889e}.save{width:100%;border:0;border-radius:16px;padding:15px;background:#268fff;color:#fff;font-size:16px;font-weight:850}.save.secondary{background:#132a40;border:1px solid #294963}.save:disabled{opacity:.55}.sheet-note{text-align:center;font-size:12px;color:#8398ad;margin:10px 0 15px}.close{width:100%;border:0;background:transparent;color:#8499ad;padding:12px}.field{width:100%;border:1px solid #294963;background:#06121e;color:#fff;border-radius:14px;padding:13px 14px;font-size:15px;margin:6px 0}.league-item,.member{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #172b40}.league-item:last-child,.member:last-child{border-bottom:0}.league-name{font-weight:800}.meta{font-size:12px;color:#879db3;margin-top:3px}.mini-btn{border:1px solid #2a4b68;background:#10263b;color:#d9ebfb;border-radius:12px;padding:8px 10px}.owner{color:#70e5ae}.member-left{display:flex;align-items:center;gap:10px}.member .avatar{width:36px;height:36px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:#70e5ae}.divider{height:1px;background:#172b40;margin:17px 0}.view{display:none}.view.active{display:block}.page-head{display:flex;align-items:end;justify-content:space-between;margin:18px 0 12px}.page-head h1{margin:0;font-size:25px}.board-card{overflow:hidden}.board-title{padding:16px;border-bottom:1px solid #183049}.board-title strong{font-size:18px}.board-title span{display:block;color:#879db3;font-size:12px;margin-top:4px}.board-scroll{overflow:visible}.board{width:100%;border-collapse:collapse;table-layout:fixed}.board th{font-size:8px;text-transform:uppercase;letter-spacing:0;color:#72879b;font-weight:700;padding:8px 2px;text-align:center;border-bottom:1px solid #183049;line-height:1.15}.board td{padding:10px 2px;border-bottom:1px solid #132a40;text-align:center;font-size:12px}.board tr:last-child td{border-bottom:0}.board th:nth-child(1),.board td:nth-child(1){width:8%}.board th:nth-child(2),.board td:nth-child(2){width:35%}.board th:nth-child(3),.board td:nth-child(3){width:11%}.board th:nth-child(4),.board td:nth-child(4){width:11%}.board th:nth-child(5),.board td:nth-child(5){width:11%}.board th:nth-child(6),.board td:nth-child(6){width:12%}.board th:nth-child(7),.board td:nth-child(7){width:12%}.board .player{text-align:left;min-width:0}.player-wrap{display:flex;align-items:center;gap:6px;min-width:0}.player-wrap .avatar{width:28px;height:28px;flex:0 0 28px}.player-wrap>div{min-width:0}.player-wrap strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.player-wrap .meta{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place{font-size:14px;font-weight:900}.pts{font-size:15px;font-weight:900;color:#70e5ae}.badge{display:none}.board-note{padding:12px 16px;color:#7890a7;font-size:11px;border-top:1px solid #183049}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.board-title{padding:14px}.board th{font-size:7px}.board td{font-size:11px}.player-wrap .avatar{width:24px;height:24px;flex-basis:24px}.player-wrap strong{font-size:11px}}
</style></head><body><main class="app"><div class="top"><button type="button" class="select" onclick="toast('Сейчас доступна Лига чемпионов 2026/27')">🏆 Лига чемпионов ▾</button><button id="leagueSelect" type="button" class="select small" onclick="openLeagues()">👥 Мои лиги ▾</button><button type="button" class="bell">🔔</button></div><div id="homeView" class="view active"><div id="profile" class="profile"></div><section class="section"><div class="card tournament"><div><div class="tournament-title">Прогноз на турнир</div><div class="muted" style="font-size:13px;margin-top:5px">Победитель, призёры и лучшие игроки</div></div><div class="pill">Скоро</div></div></section><section class="section"><div class="section-head"><h2>Ближайшие матчи</h2><span class="link">Все матчи</span></div><div id="matches"><div class="loading">Загружаем матчи…</div></div></section></div><div id="tableView" class="view"><div class="page-head"><div><div class="muted" style="font-size:12px">Рейтинг прогнозистов</div><h1>Таблица</h1></div><button type="button" class="mini-btn" onclick="openLeagues()">Сменить лигу</button></div><div id="leaderboard"><div class="card loading">Загружаем таблицу…</div></div></div></main><nav class="nav"><button id="navHome" type="button" class="active" onclick="showHome()">Главная</button><button type="button" onclick="toast('Раздел Матчи — следующий')">Матчи</button><button type="button" onclick="openLeagues()">Лиги</button><button id="navTable" type="button" onclick="showLeaderboard()">Таблица</button><button type="button" onclick="toast('Меню — следующий раздел')">Меню</button></nav><div id="toast" class="toast"></div><div id="modal" class="backdrop"><div class="sheet"><div class="handle"></div><div id="sheetContent"></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const matchesEl=document.getElementById('matches'),profileEl=document.getElementById('profile'),toastEl=document.getElementById('toast'),modal=document.getElementById('modal'),sheetContent=document.getElementById('sheetContent'),leagueSelect=document.getElementById('leagueSelect'),homeView=document.getElementById('homeView'),tableView=document.getElementById('tableView'),leaderboardEl=document.getElementById('leaderboard'),navHome=document.getElementById('navHome'),navTable=document.getElementById('navTable');let token=localStorage.getItem('access_token')||'',myPredictions={},renderedMatches=[],activeMatch=null,leagues=[],selectedLeague=null;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1900)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function logo(t){return t.logo?`<img src="${esc(t.logo)}" alt="">`:`<div class="crest"></div>`}function fmt(dt){const d=new Date(dt);return{date:d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}),time:d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}}async function api(url,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(url,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}async function login(){if(token){try{return await api('/api/auth/me')}catch{localStorage.removeItem('access_token');token=''}}if(!tg?.initData)throw new Error('Открой приложение через кнопку Telegram-бота');const r=await fetch('/api/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Ошибка входа');token=d.access_token;localStorage.setItem('access_token',token);return api('/api/auth/me')}function renderProfile(me){profileEl.innerHTML=`${me.avatar_url?`<img class="avatar" src="${esc(me.avatar_url)}">`:'<div class="avatar"></div>'}<div><strong>${esc(me.display_name||me.username||'Игрок')}</strong><span>${me.role==='superadmin'?'superadmin':'игрок'}</span></div>`}
function setNav(active){navHome.classList.toggle('active',active==='home');navTable.classList.toggle('active',active==='table')}function showHome(){homeView.classList.add('active');tableView.classList.remove('active');setNav('home')}async function showLeaderboard(){homeView.classList.remove('active');tableView.classList.add('active');setNav('table');await loadLeaderboard()}
function updateLeagueSelector(){leagueSelect.textContent=selectedLeague?`👥 ${selectedLeague.name} ▾`:'👥 Мои лиги ▾'}function chooseLeague(id){selectedLeague=leagues.find(x=>x.id===id)||null;if(selectedLeague)localStorage.setItem('selected_league_id',String(selectedLeague.id));updateLeagueSelector();closeSheet();toast(selectedLeague?`Лига: ${selectedLeague.name}`:'Лига не выбрана');if(tableView.classList.contains('active'))loadLeaderboard()}async function loadLeagues(){const d=await api('/api/leagues/mine');leagues=d.response||[];const saved=Number(localStorage.getItem('selected_league_id')||0);selectedLeague=leagues.find(x=>x.id===saved)||leagues[0]||null;if(selectedLeague)localStorage.setItem('selected_league_id',String(selectedLeague.id));updateLeagueSelector()}
function predText(m){const p=myPredictions[m.id];if(p)return `<div class="prediction-state has">Твой прогноз<br>${p.home_score}:${p.away_score}</div>`;return `<div class="prediction-state">Прогноза нет</div>`}function renderMatches(items){renderedMatches=items.filter(m=>new Date(m.kickoff_at)>new Date()).sort((a,b)=>new Date(a.kickoff_at)-new Date(b.kickoff_at)).slice(0,8);if(!renderedMatches.length){matchesEl.innerHTML='<div class="card empty">Ближайших матчей пока нет</div>';return}let last='',html='';for(const m of renderedMatches){const f=fmt(m.kickoff_at);if(f.date!==last){html+=`<div class="date">${esc(f.date)}</div>`;last=f.date}html+=`<article class="card match" onclick="openPrediction(${m.id})"><div class="round">${esc(m.round||'Лига чемпионов')}</div><div class="teams"><div class="team">${logo(m.home)}<div>${esc(m.home.name)}</div></div><div class="center"><div class="time">${f.time}</div>${predText(m)}</div><div class="team">${logo(m.away)}<div>${esc(m.away.name)}</div></div></div><div class="actions"><button type="button" class="action" onclick="event.stopPropagation();openParticipants()">👥 Участники</button><button type="button" class="action ai" onclick="event.stopPropagation();toast('Прогноз Оракула подключим следующим этапом')">✦ Прогноз ИИ</button></div></article>`}matchesEl.innerHTML=html}
function openSheet(html){sheetContent.innerHTML=html;modal.classList.add('open')}function closeSheet(){modal.classList.remove('open');activeMatch=null}modal.addEventListener('click',e=>{if(e.target===modal)closeSheet()});function openPrediction(id){const m=renderedMatches.find(x=>x.id===id);if(!m)return;activeMatch=m;const p=myPredictions[id],locked=new Date(m.kickoff_at)<=new Date();openSheet(`<div class="sheet-round">${esc(m.round||'Лига чемпионов')} · ${fmt(m.kickoff_at).time}</div><div class="sheet-teams"><div class="sheet-team">${logo(m.home)}${esc(m.home.name)}</div><div class="vs">VS</div><div class="sheet-team">${logo(m.away)}${esc(m.away.name)}</div></div><div class="score-row"><input id="modalHome" class="score" type="number" min="0" max="30" value="${p?.home_score??''}" placeholder="0" ${locked?'disabled':''}><span class="colon">:</span><input id="modalAway" class="score" type="number" min="0" max="30" value="${p?.away_score??''}" placeholder="0" ${locked?'disabled':''}></div><div id="modalNote" class="sheet-note">${locked?'Матч начался — прогноз закрыт':p?'Можно изменить прогноз до начала матча':'Прогноз скрыт от других до начала матча'}</div>${locked?'':`<button id="modalSave" type="button" class="save" onclick="savePrediction()">${p?'Изменить прогноз':'Сохранить прогноз'}</button>`}<button type="button" class="close" onclick="closeSheet()">Закрыть</button>`)}async function savePrediction(){if(!activeMatch)return;const h=document.getElementById('modalHome'),a=document.getElementById('modalAway'),note=document.getElementById('modalNote'),b=document.getElementById('modalSave');if(h.value===''||a.value===''){note.textContent='Укажи оба счёта';note.className='sheet-note error';return}try{b.disabled=true;const p=await api(`/api/predictions/matches/${activeMatch.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({home_score:Number(h.value),away_score:Number(a.value)})});myPredictions[activeMatch.id]=p;toast('Прогноз сохранён ✓');closeSheet();renderMatches(renderedMatches)}catch(e){note.textContent=e.message;note.className='sheet-note error';b.disabled=false}}
function openLeagues(){let list=leagues.length?leagues.map(l=>`<div class="league-item"><div><div class="league-name ${l.member_role==='owner'?'owner':''}">${esc(l.name)}</div><div class="meta">${l.member_count} участник(а) · ${l.member_role==='owner'?'Владелец':'Участник'} · код <span class="code">${esc(l.invite_code)}</span></div></div><button class="mini-btn" onclick="chooseLeague(${l.id})">${selectedLeague?.id===l.id?'Выбрана':'Выбрать'}</button></div>`).join(''):'<div class="empty">У тебя пока нет лиг</div>';openSheet(`<div class="sheet-title">Лиги</div>${list}<div class="divider"></div><input id="newLeagueName" class="field" placeholder="Название новой лиги"><button type="button" class="save" onclick="createLeague()">Создать лигу</button><div class="divider"></div><input id="joinCode" class="field" placeholder="Код приглашения"><button type="button" class="save secondary" onclick="joinLeague()">Вступить по коду</button><button type="button" class="close" onclick="closeSheet()">Закрыть</button>`)}async function createLeague(){const el=document.getElementById('newLeagueName'),name=el?.value.trim();if(!name){toast('Введи название лиги');return}try{const l=await api('/api/leagues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,tournament_provider:'sstats',tournament_season:2026,is_private:true,include_oracle:true})});await loadLeagues();selectedLeague=leagues.find(x=>x.id===l.id)||selectedLeague;if(selectedLeague)localStorage.setItem('selected_league_id',String(selectedLeague.id));updateLeagueSelector();closeSheet();toast(`Лига «${l.name}» создана`)}catch(e){toast(e.message)}}async function joinLeague(){const el=document.getElementById('joinCode'),code=el?.value.trim();if(!code){toast('Введи код приглашения');return}try{const l=await api('/api/leagues/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invite_code:code})});await loadLeagues();selectedLeague=leagues.find(x=>x.id===l.id)||selectedLeague;if(selectedLeague)localStorage.setItem('selected_league_id',String(selectedLeague.id));updateLeagueSelector();closeSheet();toast(`Ты в лиге «${l.name}»`)}catch(e){toast(e.message)}}async function openParticipants(){if(!selectedLeague){openLeagues();toast('Сначала создай или выбери лигу');return}openSheet('<div class="loading">Загружаем участников…</div>');try{const d=await api(`/api/leagues/${selectedLeague.id}/members`);const list=(d.response||[]).map(m=>`<div class="member"><div class="member-left">${m.avatar_url?`<img class="avatar" src="${esc(m.avatar_url)}">`:'<div class="avatar"></div>'}<div><div class="league-name">${esc(m.display_name)}</div><div class="meta">${m.username?'@'+esc(m.username)+' · ':''}${m.role==='owner'?'Владелец':'Участник'}</div></div></div></div>`).join('');openSheet(`<div class="sheet-title">${esc(selectedLeague.name)}</div><div class="meta" style="margin-bottom:10px">Участников: ${d.count} · Код приглашения <span class="code">${esc(selectedLeague.invite_code)}</span></div>${list||'<div class="empty">Пока никого</div>'}<button type="button" class="close" onclick="closeSheet()">Закрыть</button>`)}catch(e){openSheet(`<div class="sheet-title">Ошибка</div><div class="error">${esc(e.message)}</div><button class="close" onclick="closeSheet()">Закрыть</button>`)}}
async function loadLeaderboard(){if(!selectedLeague){leaderboardEl.innerHTML='<div class="card empty">Сначала создай или выбери лигу</div>';return}leaderboardEl.innerHTML='<div class="card loading">Загружаем таблицу…</div>';try{const d=await api(`/api/leagues/${selectedLeague.id}/leaderboard`);const rows=(d.response||[]).map(r=>`<tr><td class="place">${r.place}</td><td class="player"><div class="player-wrap">${r.avatar_url?`<img class="avatar" src="${esc(r.avatar_url)}">`:'<div class="avatar"></div>'}<div><strong>${esc(r.display_name)}</strong><div class="meta">${r.member_role==='owner'?'Владелец · ':''}${r.username?'@'+esc(r.username):'участник'}</div></div></div></td><td class="pts">${r.points}</td><td>${r.outcomes}</td><td>${r.exacts}</td><td>${r.predictions}</td><td>${Number(r.accuracy).toFixed(1)}%</td></tr>`).join('');leaderboardEl.innerHTML=`<div class="card board-card"><div class="board-title"><strong>${esc(selectedLeague.name)}</strong><span>Лига чемпионов 2026/27 · ${d.count} участник(а)</span></div><div class="board-scroll"><table class="board"><thead><tr><th>№</th><th class="player">Участник</th><th>Очки</th><th>Исход</th><th>Точно</th><th>Прогн.</th><th>%</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Пока нет участников</td></tr>'}</tbody></table></div><div class="board-note">Точный счёт — 3 очка · правильный исход — 1 очко. Процент считается по завершённым матчам с прогнозом.</div></div>`}catch(e){leaderboardEl.innerHTML=`<div class="card empty error">${esc(e.message)}</div>`}}
window.openPrediction=openPrediction;window.closeSheet=closeSheet;window.savePrediction=savePrediction;window.openLeagues=openLeagues;window.chooseLeague=chooseLeague;window.createLeague=createLeague;window.joinLeague=joinLeague;window.openParticipants=openParticipants;window.showHome=showHome;window.showLeaderboard=showLeaderboard;
(async()=>{try{const me=await login();renderProfile(me);const [preds,matches]=await Promise.all([api('/api/predictions/mine'),fetch('/api/matches?season=2026&provider=sstats').then(r=>r.json()),loadLeagues()]);for(const p of preds.response||[])myPredictions[p.match_id]=p;renderMatches(matches.response||[])}catch(e){matchesEl.innerHTML=`<div class="card empty error">${esc(e.message)}</div>`}})();
</script></body></html>
