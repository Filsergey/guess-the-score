<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Угадай счёт</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#12345c 0,#07111f 42%,#040a12 100%);color:#fff}.app{max-width:560px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}.top{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5;padding:8px 0 12px;background:linear-gradient(#07111f 75%,transparent)}.select{flex:1;background:#0d1c2e;border:1px solid #1b3652;color:#fff;border-radius:14px;padding:11px 12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.select.small{flex:.8}.bell{width:42px;height:42px;border:1px solid #1b3652;background:#0d1c2e;color:#fff;border-radius:14px;font-size:18px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:20px;margin:0}.link{color:#65b1ff;font-size:13px}.card{background:linear-gradient(145deg,rgba(18,43,73,.96),rgba(8,20,34,.96));border:1px solid #1b3652;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.24)}.tournament{padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center}.tournament-title{font-size:17px;font-weight:800}.muted{color:#93a8bd}.pill{font-size:12px;border:1px solid #275f4c;background:#0c2b25;color:#70e5ae;padding:6px 9px;border-radius:999px}.date{font-size:13px;color:#8da1b6;margin:18px 3px 8px}.match{padding:16px;margin-bottom:10px}.round{font-size:11px;color:#7e93aa;text-align:center;margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:10px}.team{text-align:center;font-size:13px;font-weight:700;min-width:0}.team img,.crest{width:48px;height:48px;object-fit:contain;margin:0 auto 7px;display:block}.crest{border-radius:50%;background:#16314e}.time{text-align:center}.time strong{font-size:18px}.time span{display:block;font-size:11px;color:#8da1b6;margin-top:3px}.prediction{margin-top:14px;padding-top:14px;border-top:1px solid #183049}.pred-row{display:flex;align-items:center;justify-content:center;gap:9px}.score{width:54px;background:#071521;color:#fff;border:1px solid #294560;border-radius:12px;padding:10px;text-align:center;font-size:18px;font-weight:800}.dash{color:#70879d}.save{margin-left:5px;border:0;border-radius:12px;background:#268fff;color:#fff;padding:11px 14px;font-weight:800}.save:disabled{opacity:.55}.pred-state{text-align:center;font-size:12px;margin-top:8px;color:#8fa4b9}.success{color:#70e5ae}.error{color:#ff8d8d}.empty{padding:22px;text-align:center;color:#93a8bd}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#17324e;object-fit:cover}.profile strong{font-size:14px}.profile span{display:block;font-size:11px;color:#8fa4b9}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:rgba(5,13,23,.95);border-top:1px solid #172b40;backdrop-filter:blur(16px);z-index:10}.nav button{border:0;background:transparent;color:#8093a8;font-size:11px;padding:6px 2px}.nav .active{color:#58aaff}.loading{padding:28px;text-align:center;color:#93a8bd}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#102337;border:1px solid #26435f;border-radius:14px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><div class="select">🏆 Лига чемпионов ▾</div><div class="select small">👥 Шашлычники ▾</div><button type="button" class="bell">🔔</button></div>
  <div id="profile" class="profile"></div>
  <section class="section"><div class="card tournament"><div><div class="tournament-title">Прогноз на турнир</div><div class="muted" style="font-size:13px;margin-top:5px">Победитель, призёры и лучшие игроки</div></div><div class="pill">Скоро</div></div></section>
  <section class="section"><div class="section-head"><h2>Ближайшие матчи</h2><span class="link">Все матчи</span></div><div id="matches"><div class="loading">Загружаем матчи…</div></div></section>
</main>
<nav class="nav"><button type="button" class="active">Главная</button><button type="button">Матчи</button><button type="button">Лиги</button><button type="button">Таблица</button><button type="button">Меню</button></nav>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const matchesEl=document.getElementById('matches'),profileEl=document.getElementById('profile'),toastEl=document.getElementById('toast');
let token=localStorage.getItem('access_token')||'',myPredictions={},renderedMatches=[];
function toast(text){toastEl.textContent=text;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function logo(team){return team.logo?`<img src="${esc(team.logo)}" alt="">`:`<div class="crest"></div>`}
function fmt(dt){const d=new Date(dt);return {date:d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}),time:d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(url,opts);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`HTTP ${r.status}`);return data}
async function login(){if(token){try{return await api('/api/auth/me')}catch{localStorage.removeItem('access_token');token=''}}if(!tg?.initData)throw new Error('Открой приложение через кнопку Telegram-бота');const r=await fetch('/api/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Ошибка входа');token=data.access_token;localStorage.setItem('access_token',token);return api('/api/auth/me')}
function renderProfile(me){profileEl.innerHTML=`${me.photo_url?`<img class="avatar" src="${esc(me.photo_url)}" alt="">`:'<div class="avatar"></div>'}<div><strong>${esc(me.display_name||me.username||'Игрок')}</strong><span>${me.role==='superadmin'?'superadmin':'игрок'}</span></div>`}
function predictionHtml(match){const p=myPredictions[match.id],locked=new Date(match.kickoff_at)<=new Date();if(locked)return `<div class="prediction"><div class="pred-state">${p?`Твой прогноз: <b>${p.home_score}:${p.away_score}</b>${p.points!==null?` · +${p.points}`:''}`:'Прогноз не сделан'}</div></div>`;return `<div class="prediction"><div class="pred-row"><input class="score" id="h-${match.id}" type="number" min="0" max="30" value="${p?.home_score??''}" placeholder="0"><span class="dash">:</span><input class="score" id="a-${match.id}" type="number" min="0" max="30" value="${p?.away_score??''}" placeholder="0"><button type="button" class="save" id="b-${match.id}" onclick="savePrediction(event,${match.id})">${p?'Изменить':'Сохранить'}</button></div><div class="pred-state ${p?'success':''}" id="s-${match.id}">${p?'Прогноз сохранён':'Прогноза нет'}</div></div>`}
function renderMatches(items){renderedMatches=items.filter(m=>new Date(m.kickoff_at)>new Date()).slice(0,8);if(!renderedMatches.length){matchesEl.innerHTML='<div class="card empty">Ближайших матчей пока нет</div>';return}let last='',html='';for(const m of renderedMatches){const f=fmt(m.kickoff_at);if(f.date!==last){html+=`<div class="date">${esc(f.date)}</div>`;last=f.date}html+=`<article class="card match" id="match-${m.id}"><div class="round">${esc(m.round||'Лига чемпионов')}</div><div class="teams"><div class="team">${logo(m.home)}<div>${esc(m.home.name)}</div></div><div class="time"><strong>${f.time}</strong><span>${m.status==='NS'?'Не начался':esc(m.status)}</span></div><div class="team">${logo(m.away)}<div>${esc(m.away.name)}</div></div></div>${predictionHtml(m)}</article>`}matchesEl.innerHTML=html}
async function savePrediction(ev,id){ev?.preventDefault();ev?.stopPropagation();const h=document.getElementById(`h-${id}`),a=document.getElementById(`a-${id}`),s=document.getElementById(`s-${id}`),b=document.getElementById(`b-${id}`),card=document.getElementById(`match-${id}`);if(!h||!a||!s||!card)return;if(h.value===''||a.value===''){s.textContent='Укажи оба счёта';s.className='pred-state error';return}try{b.disabled=true;const p=await api(`/api/predictions/matches/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({home_score:Number(h.value),away_score:Number(a.value)})});myPredictions[id]=p;s.textContent=`Прогноз сохранён: ${p.home_score}:${p.away_score}`;s.className='pred-state success';b.textContent='Изменить';toast('Прогноз сохранён ✓');card.scrollIntoView({block:'nearest'})}catch(e){s.textContent=e.message;s.className='pred-state error'}finally{if(b)b.disabled=false}}
window.savePrediction=savePrediction;
(async()=>{try{const me=await login();renderProfile(me);const [preds,matches]=await Promise.all([api('/api/predictions/mine'),fetch('/api/matches?season=2026&provider=sstats').then(r=>r.json())]);for(const p of preds.response||[])myPredictions[p.match_id]=p;renderMatches(matches.response||[])}catch(e){matchesEl.innerHTML=`<div class="card empty error">${esc(e.message)}</div>`}})();
</script>
</body>
</html>
